<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#fbf9f4"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#ddd6c5" stroke-width="1"/>

  <!-- Steeple -->
  <rect x="380" y="90" width="40" height="90" fill="#1e3a5f"/>
  <polygon points="360,90 440,90 400,40" fill="#1e3a5f"/>
  <line x1="400" y1="40" x2="400" y2="15" stroke="#9c7a3c" stroke-width="4"/>
  <line x1="391" y1="24" x2="409" y2="24" stroke="#9c7a3c" stroke-width="4"/>

  <!-- Main building -->
  <rect x="220" y="180" width="360" height="180" fill="#ffffff" stroke="#1e3a5f" stroke-width="3"/>
  <polygon points="220,180 580,180 400,120" fill="#1e3a5f"/>

  <!-- Windows -->
  <rect x="260" y="230" width="30" height="60" rx="15" fill="none" stroke="#9c7a3c" stroke-width="3"/>
  <rect x="330" y="230" width="30" height="60" rx="15" fill="none" stroke="#9c7a3c" stroke-width="3"/>
  <rect x="440" y="230" width="30" height="60" rx="15" fill="none" stroke="#9c7a3c" stroke-width="3"/>
  <rect x="510" y="230" width="30" height="60" rx="15" fill="none" stroke="#9c7a3c" stroke-width="3"/>

  <!-- Door -->
  <rect x="385" y="290" width="30" height="70" fill="#1e3a5f"/>

  <!-- Ground line -->
  <line x1="180" y1="360" x2="620" y2="360" stroke="#1e3a5f" stroke-width="2"/>
</svg>
